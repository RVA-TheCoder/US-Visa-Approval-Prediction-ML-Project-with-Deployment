# -------------------------------------------------------------
# GitHub Actions Workflow: Deploy Application Docker Image to EC2
# 
# This workflow has two jobs:
#   1. Continuous Integration (CI):
#        - Triggered on push to 'main'
#        - Builds a Docker image and pushes it to Amazon ECR

#   2. Continuous Deployment (CD):
#        - Runs after CI job completes
#        - Executes on a self-hosted EC2 runner
#        - Pulls the latest Docker image from ECR and runs the container
#
# Secrets required in GitHub repository:
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#   - AWS_DEFAULT_REGION
#   - ECR_REPOSITORY_NAME  (used in CI)
#   - ECR_REPOSITORY       (used in CD — check naming consistency!)
#   - MONGODB_URI_KEY
#

#   - Be sure our self-hosted runner has Docker installed and permissions set.
# -------------------------------------------------------------

name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches: [main] # Trigger only on pushes to main branch


jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout
        uses: actions/checkout@v2

      # Step 2: Configure AWS CLI credentials from GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # Step 3: Authenticate Docker to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Step 4: Build and push Docker image to ECR
      - name: Build, tag, and push docker image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .  
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted  # Must be an EC2 machine with Docker

    steps:
      # Step 1: Checkout source code (optional if not needed on server)
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # Step 3: Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Step 4: Pull latest image and restart container
      - name: Pull and run Docker image from ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
          
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker stop app-container || true
          docker rm app-container || true
          docker run -d \
            --name app-container \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" \
            -e MONGODB_URI_KEY="${{ secrets.MONGODB_URI_KEY }}" \
            -p 8080:8080 \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

